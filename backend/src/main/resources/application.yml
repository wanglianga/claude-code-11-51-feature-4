spring:
  application:
    name: metric-platform
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ccdev
    username: ccdev
    password: ccdev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  cutoff:
    late-refund-enabled: true
  lineage:
    enabled: true
